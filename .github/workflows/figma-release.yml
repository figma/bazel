# =============================================================================
# Figma Bazel Release
# =============================================================================
#
# Builds Figma's Bazel fork from source and publishes a GitHub release whose
# binaries follow Bazelisk's asset-naming conventions, so any project can pin a
# Figma build the same way it would pin an official Bazel release.
#
# -----------------------------------------------------------------------------
# Cutting a release
# -----------------------------------------------------------------------------
# This workflow lives on the default branch (master) ONLY so it shows up under
# Actions > "Figma Bazel Release" > "Run workflow" in the GitHub UI. It builds
# whatever `ref` you point it at, so the file itself never changes between
# releases. There is exactly ONE input:
#
#   ref   The fork branch (or tag/commit) to build. By convention this is named
#         `<upstream-version>-figma`, e.g. `8.6.0-figma`.
#
# Everything else is computed — there is no human-chosen version string to get
# wrong:
#
#   * upstream base version  = `ref` with `-figma...` stripped, e.g. `8.6.0`.
#       This is the host Bazel used to build (see USE_BAZEL_VERSION below), and
#       the `setup` job asserts that `ref` actually descends from the upstream
#       `<base>` tag — so a branch mislabeled `8.6.0-figma` that was really cut
#       from 8.5.0 fails fast instead of producing a wrongly-named release.
#
#   * fork build counter     = max existing `<base>-figmaN` release + 1.
#       The `setup` job lists existing releases and auto-increments, so re-cuts
#       can never collide with or skip a previous build number. First build of
#       a base is `1`.
#
#   * release version / tag  = `<base>-figma<counter>`, e.g. `8.6.0-figma2`.
#
#       NOTE the format carefully: a hyphen after x.y.z, then "figma", then the
#       number with NO dot. This is dictated by Bazelisk, which only accepts a
#       custom suffix via its "patch" grammar `^(\d+\.\d+\.\d+)-([\w\d]+)$` —
#       the suffix may contain letters/digits/underscore but NOT dots. So
#       `8.6.0-figma2` is valid, while `8.6.0-figma.2` and `8.6.0figma2` are
#       both rejected by Bazelisk ("invalid version").
#
# The release is tagged exactly `<version>` and gets one binary per platform
# plus a matching `.sha256`. Asset names match Bazelisk's convention
# `bazel-<version>-<os>-<arch>` (and the JDK-less `bazel_nojdk-<version>-...`):
#
#   bazel-8.6.0-figma2-linux-x86_64         bazel_nojdk-8.6.0-figma2-linux-x86_64
#   bazel-8.6.0-figma2-linux-arm64          bazel_nojdk-8.6.0-figma2-linux-arm64
#   bazel-8.6.0-figma2-darwin-arm64         bazel_nojdk-8.6.0-figma2-darwin-arm64
#
# -----------------------------------------------------------------------------
# Consuming a release (how to point YOUR build's environment at our fork)
# -----------------------------------------------------------------------------
# Bazelisk can download forked Bazel binaries straight from a fork's GitHub
# releases when the version is given as `<fork>/<version>`. For our releases the
# fork is `figma` (i.e. the repo github.com/figma/bazel). So, to make a project
# use a Figma build, set ONE of the following (env var wins over the file):
#
#   # Option A — environment variable (best for CI / one-off overrides):
#   export USE_BAZEL_VERSION=figma/8.6.0-figma2
#
#   # Option B — check it into the repo so every invocation is pinned:
#   echo 'figma/8.6.0-figma2' > .bazelversion
#
# With either set, `bazel ...` (run through Bazelisk) resolves to the URL:
#
#   https://github.com/figma/bazel/releases/download/8.6.0-figma2/bazel-8.6.0-figma2-<os>-<arch>
#
# where Bazelisk fills in <os> (`linux`/`darwin`) and <arch> (`x86_64`/`arm64`)
# for the current machine. That is why the release tag, the embedded version,
# and the `<version>` segment of every asset name MUST all be identical.
#
# Related Bazelisk knobs:
#   BAZELISK_NOJDK=1          fetch the `bazel_nojdk-*` assets (no embedded JDK)
#   BAZELISK_BASE_URL=<url>   mirror the binaries somewhere other than GitHub
#                             (Bazelisk then appends `/<version>/<filename>`)
#
# Refs: https://github.com/bazelbuild/bazelisk#how-does-bazelisk-know-which-bazel-version-to-run
#       https://github.com/bazelbuild/bazelisk (forks / naming conventions)
# =============================================================================

name: Figma Bazel Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Fork branch/tag/commit to build, named <upstream-version>-figma (e.g. 8.6.0-figma). The release version is derived automatically."
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Resolve everything from `ref` so no version string is ever typed by hand.
  setup:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve base version and figma build counter
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref='${{ inputs.ref }}'

          # 1. Derive the upstream base version from the fork branch name.
          base="${ref%%-figma*}"
          if [ "$base" = "$ref" ] || [ -z "$base" ]; then
            echo "::error::ref '$ref' must be a Figma fork branch named like '8.6.0-figma'"
            exit 1
          fi
          if ! printf '%s' "$base" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::derived base '$base' is not a valid x.y.z version (from ref '$ref')"
            exit 1
          fi

          # 2. Sanity check: the ref must actually descend from upstream <base>.
          git remote add upstream https://github.com/bazelbuild/bazel.git 2>/dev/null || true
          git fetch --no-tags upstream "refs/tags/${base}:refs/tags/upstream-${base}"
          if ! git merge-base --is-ancestor "upstream-${base}" HEAD; then
            echo "::error::ref '$ref' does not descend from upstream Bazel ${base} — wrong base version?"
            exit 1
          fi

          # 3. Auto-increment the figma build counter from existing releases.
          #    The version MUST satisfy Bazelisk's "patch" grammar
          #    `^(\d+\.\d+\.\d+)-([\w\d]+)$`: a mandatory hyphen after x.y.z,
          #    then letters/digits/underscore only (NO dots). So the counter is
          #    `<base>-figma<N>` (e.g. 8.6.0-figma1) — note there is no dot
          #    before the number; `8.6.0-figma.1` is rejected by Bazelisk.
          #    Match exactly "<base>-figma<N>" and take the max N (default 0).
          esc_base="$(printf '%s' "$base" | sed 's/\./\\./g')"
          max="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
                   --json tagName --jq '.[].tagName' \
                 | grep -E "^${esc_base}-figma[0-9]+$" \
                 | sed -E 's/.*-figma//' \
                 | sort -n | tail -1 || true)"
          next=$(( ${max:-0} + 1 ))
          version="${base}-figma${next}"

          sha="$(git rev-parse HEAD)"
          {
            echo "sha=$sha"
            echo "base_version=$base"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          echo "ref '$ref' @ ${sha:0:12}"
          echo "upstream base: $base (host Bazel)"
          echo "previous figma build for $base: ${max:-none}"
          echo "=> release version / tag: $version"

  # Linux binaries are built INSIDE an old-glibc Ubuntu container (via
  # `docker run`), not directly on the runner. GitHub's oldest hosted Ubuntu is
  # 22.04 (glibc 2.35), which links symbols too new for older CI machines
  # (e.g. `GLIBC_2.34 not found`). Building in ubuntu:20.04 (glibc 2.31) keeps
  # the binary runnable on Ubuntu 20.04+/RHEL8+. All GitHub JS actions
  # (checkout, upload-artifact) still run on the host, so the container never
  # needs a node24-compatible userspace — only a C/C++ toolchain.
  build-linux:
    name: build ${{ matrix.platform }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            arch: x86_64
            bazelisk_arch: amd64
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            arch: arm64
            bazelisk_arch: arm64
    steps:
      # Check out the exact commit resolved by `setup` so every platform builds
      # an identical tree even if the branch moves mid-run.
      - name: Checkout ${{ needs.setup.outputs.sha }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - name: Build Bazel in ubuntu:20.04 (old glibc) and package
        env:
          # Bazelisk reads this instead of the checked-in .bazelversion, so the
          # host Bazel used to build always matches the upstream base version.
          USE_BAZEL_VERSION: ${{ needs.setup.outputs.base_version }}
          VERSION: ${{ needs.setup.outputs.version }}
          ARCH: ${{ matrix.arch }}
          BAZELISK_ARCH: ${{ matrix.bazelisk_arch }}
        run: |
          set -euo pipefail
          # Build (and package) entirely inside the old-glibc container. The
          # repo is bind-mounted; env vars are forwarded with -e. Link with lld:
          # it supports the --start-lib/--end-lib flags Bazel emits (bfd on
          # 20.04's binutils 2.34 does not) and avoids the aarch64 gold
          # erratum-843419 crash. Linker choice does not affect glibc portability.
          docker run --rm \
            -v "$PWD":/workspace -w /workspace \
            -e USE_BAZEL_VERSION -e VERSION -e ARCH -e BAZELISK_ARCH \
            ubuntu:20.04 bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential lld python3 zip unzip curl ca-certificates
              curl -fsSL -o /usr/local/bin/bazel \
                "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-${BAZELISK_ARCH}"
              chmod +x /usr/local/bin/bazel
              bazel build -c opt --stamp \
                --embed_label "$VERSION" \
                --incompatible_strict_action_env=true \
                --linkopt=-fuse-ld=lld \
                //src:bazel //src:bazel_nojdk
              mkdir -p dist
              # Bazelisk asset names: bazel-<version>-<os>-<arch> and the nojdk
              # flavor uses a "bazel_nojdk-" prefix (BAZELISK_NOJDK consumers).
              cp bazel-bin/src/bazel        "dist/bazel-${VERSION}-linux-${ARCH}"
              cp bazel-bin/src/bazel_nojdk  "dist/bazel_nojdk-${VERSION}-linux-${ARCH}"
              cd dist
              for f in "bazel-${VERSION}-linux-${ARCH}" "bazel_nojdk-${VERSION}-linux-${ARCH}"; do
                chmod +x "$f"
                sha256sum "$f" > "$f.sha256"
              done
              # Files are created as root in the bind mount; make them readable
              # by the runner user for the upload step.
              chmod -R a+rwX /workspace/dist
            '
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # macOS has no glibc, so the darwin binary is built natively on the runner.
  build-darwin:
    name: build darwin-arm64
    needs: setup
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Checkout ${{ needs.setup.outputs.sha }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-darwin-arm64"
          chmod +x /tmp/bazelisk
          sudo mv /tmp/bazelisk /usr/local/bin/bazel

      - name: Build Bazel
        env:
          USE_BAZEL_VERSION: ${{ needs.setup.outputs.base_version }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          bazel build -c opt --stamp \
            --embed_label "$VERSION" \
            --incompatible_strict_action_env=true \
            //src:bazel //src:bazel_nojdk

      - name: Package artifacts
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          label="$VERSION"
          mkdir -p dist
          cp bazel-bin/src/bazel        "dist/bazel-${label}-darwin-arm64"
          cp bazel-bin/src/bazel_nojdk  "dist/bazel_nojdk-${label}-darwin-arm64"
          cd dist
          for f in "bazel-${label}-darwin-arm64" "bazel_nojdk-${label}-darwin-arm64"; do
            chmod +x "$f"
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -l

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [setup, build-linux, build-darwin]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ needs.setup.outputs.sha }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.setup.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          BASE_VERSION: ${{ needs.setup.outputs.base_version }}
        run: |
          set -euo pipefail
          label="$VERSION"
          base="$BASE_VERSION"
          ref='${{ inputs.ref }}'

          # Fetch the upstream base tag so we can describe drift from upstream.
          git remote add upstream https://github.com/bazelbuild/bazel.git 2>/dev/null || true
          git fetch --no-tags upstream "refs/tags/${base}:refs/tags/upstream-${base}"

          upstream_sha="$(git rev-parse --short "upstream-${base}")"
          head_sha="$(git rev-parse --short HEAD)"

          # Header + upstream base. Escaped backticks here are literal markdown.
          {
            echo "# Bazel ${label}"
            echo
            echo "Figma's Bazel fork — built by GitHub Actions from \`${ref}\` @ \`${head_sha}\`."
            echo
            echo "## Upstream base"
            echo
            echo "Forked from upstream Bazel **${base}** ([bazelbuild/bazel@\`${upstream_sha}\`](https://github.com/bazelbuild/bazel/releases/tag/${base}))."
            echo
            echo "## Figma commits on top of upstream"
            echo
          } > RELEASE_NOTES.md

          # Append the commit list straight from git so the literal backticks in
          # the format string are never re-interpreted by the shell.
          if [ "$(git rev-list --count "upstream-${base}..HEAD")" -eq 0 ]; then
            echo "_None yet — identical to upstream ${base}._" >> RELEASE_NOTES.md
          else
            git log --reverse --pretty='- %s (`%h`)' "upstream-${base}..HEAD" >> RELEASE_NOTES.md
          fi

          {
            echo
            echo "## Delta vs upstream"
            echo
            echo "Full diff against upstream: https://github.com/bazelbuild/bazel/compare/${base}...figma:${ref}"
            echo
            echo "## Usage"
            echo
            echo "Pin this build with Bazelisk:"
            echo
            echo '```'
            echo "USE_BAZEL_VERSION=figma/${label}"
            echo '```'
          } >> RELEASE_NOTES.md

          echo "----- generated notes -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.setup.outputs.version }}
          TARGET_SHA: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          # --repo is required: the notes step adds an `upstream` remote, and an
          # unqualified `gh` resolves to the base repo (upstream bazelbuild/bazel)
          # rather than this fork. Pin it to this repo explicitly.
          # Tag == version so the download URL matches what Bazelisk derives
          # from USE_BAZEL_VERSION=figma/<version>. Target the exact commit
          # the whole run was pinned to in the `setup` job.
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Bazel $VERSION" \
            --notes-file RELEASE_NOTES.md \
            dist/*
